<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIU Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="diu-screen">
        <div class="header">
            <span id="current-speed">Speed: 0 km/h</span>
            <span id="time">10:30 AM</span>
        </div>

        <div id="map-area">
            <div id="google-map" style="width:100%; height:100%;"></div>
            <div id="route-display">Your Route: Not set</div>
            <div id="alert-message"></div>
        </div>

        <div class="controls">
            <button id="save-route-btn">Save Current Route</button>
            <!-- The 'Stop Navigation' button is removed as navigation simulation is no longer needed. -->

            <!-- New HTML for Saved Routes Dropdown and Clear Button -->
            <div class="route-selection">
                <span>Load Route:</span>
                <select id="saved-routes-dropdown">
                    <option value="">-- Select a saved route --</option>
                    <!-- Options will be populated by JavaScript -->
                </select>
                <button id="clear-route-btn">Clear Route</button>
            </div>
            <!-- End New HTML -->

            <div class="passenger-input">
                <span>Passengers:</span>
                <button id="minus-btn">-</button>
                <span id="passenger-count">1</span>
                <button id="plus-btn">+</button>
            </div>
            <button id="send-data-btn">Start Trip & Send Data</button>
        </div>
    </div>

    <!-- Google Maps API script should be here, with a callback function -->
    <!-- IMPORTANT: REPLACE 'YOUR_ACTUAL_API_KEY' with your actual Google Maps API key -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBr_3aQXYmoMsxfhCRJ9-EEDwvZi5VUlco&callback=initMap"></script>

    <!-- Your script.js should be loaded after the Google Maps API -->
    <script src="script.js"></script>
</body>
</html>
